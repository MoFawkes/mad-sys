name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    name: Expo mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

  dotnet:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AqiClock.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build AqiClock.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AqiClock.sln --configuration Release --no-build --no-restore --maxcpucount:1

  supabase:
    name: Supabase migrations, seed and RLS matrix
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Start local Supabase
        run: supabase start

      - name: Reset database from scratch
        run: supabase db reset --local --yes

      - name: Prove migrations and seed are repeatable
        run: supabase db reset --local --yes

      - name: Export local Supabase test environment
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Restore Supabase tests
        run: dotnet restore tests/AqiClock.SupabaseTests/AqiClock.SupabaseTests.csproj --configfile NuGet.Config

      - name: Run RLS and behavioural matrix
        run: dotnet test tests/AqiClock.SupabaseTests/AqiClock.SupabaseTests.csproj --configuration Release --no-restore

  rehearsal:
    name: Production-like migration rehearsal
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Start local Supabase
        run: supabase start

      - name: Reset to the released v0.9.6 baseline schema
        run: supabase db reset --local --yes --no-seed --version 20260716000300

      - name: Load production-like data at the baseline schema
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/rehearsal/production_state.sql

      - name: Apply pending migrations incrementally, as db push will in production
        run: supabase migration up --local

      - name: Assert migrated schema and data
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/rehearsal/assertions.sql

      - name: Export local Supabase test environment
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Restore Supabase tests
        run: dotnet restore tests/AqiClock.SupabaseTests/AqiClock.SupabaseTests.csproj --configfile NuGet.Config

      - name: Run the full matrix against the incrementally migrated database
        run: dotnet test tests/AqiClock.SupabaseTests/AqiClock.SupabaseTests.csproj --configuration Release --no-restore

      - name: Reset to the hosted generator baseline
        run: supabase db reset --local --yes --no-seed --version 20260827223000

      - name: Load hosted-equivalent generator data
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/rehearsal/generator_state.sql

      - name: Apply the v0.15 forward transition
        run: supabase migration up --local

      - name: Assert generator data, policies and signatures survived correctly
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/rehearsal/generator_forward_assertions.sql

      - name: Rehearse logical rollback to the pre-generator schema
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/rollback/v0_15_generator_down.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/rehearsal/generator_rollback_assertions.sql

      - name: Reset to the hosted generator baseline for the guard case
        run: supabase db reset --local --yes --no-seed --version 20260827223000

      - name: Prove the forward transition fails closed with generated data
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/rehearsal/generator_guard_state.sql
          set +e
          output="$(supabase migration up --local 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Forward migration unexpectedly succeeded with a generated timetable" >&2
            exit 1
          fi
          if ! grep -q "Cannot simplify timetable automation while old generator data exists" <<< "$output"; then
            echo "Forward migration failed for an unexpected reason" >&2
            exit 1
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
              if exists (
                  select 1 from supabase_migrations.schema_migrations
                  where version = '20260925173216'
              ) then
                  raise exception 'Failed forward migration was recorded';
              end if;
              if to_regclass('public.timetable_generator_blocks') is null then
                  raise exception 'Failed forward migration discarded old tables';
              end if;
          end $$;
          SQL
